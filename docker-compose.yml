version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./digital_dark_spot.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-digital-dark-spot-super-secret-key-2026-development}
    volumes:
      - app_data:/app/backend/uploads
    restart: unless-stopped

volumes:
  app_data:
